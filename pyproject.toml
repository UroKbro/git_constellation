[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-constellation"
version = "0.1.0"
description = "Visualize git history as a constellation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.2", "pygame-ce>=2.5.8", "moderngl>=5.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
git-constellation = "constellation.__main__:main"

[tool.setuptools.packages.find]
include = ["constellation*"]

[tool.setuptools.package-data]
"constellation.render" = ["shaders/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance tests"]
