[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-constellation"
version = "0.1.0"
description = "Visualize git history as a constellation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
git-constellation = "constellation.__main__:main"

[tool.setuptools]
packages = ["constellation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
